# ============================================================================
# BidForge docker-compose —— 一键启动（演示 / 部署）
#   docker compose up --build
#   前端: http://localhost:8080   后端 API: http://localhost:8001/docs
# ============================================================================
services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: bidforge-backend:latest
    container_name: bidforge-backend
    environment:
      # 离线演示默认值（无需 LLM Key / Milvus 即可跑通全流程）
      MILVUS_ENABLED: "false"
      EMBEDDING_BACKEND: "fake"
      AUTH_ENABLED: "false"
      LLM_API_KEY: "${LLM_API_KEY:-}"
      LLM_BASE_URL: "${LLM_BASE_URL:-https://api.deepseek.com}"
      LLM_MODEL: "${LLM_MODEL:-deepseek-chat}"
      BIDGEN_PORT: "8001"
    volumes:
      # 整个 data 目录持久化（上传原文/解析产物/SQLite）；样例包由 entrypoint 从
      # 镜像内 /app/samples-backup 首次启动时补齐
      - bidforge-data:/app/backend/data
    ports:
      - "8001:8001"
    restart: unless-stopped

  # 一次性 init 容器：把 backend 镜像 Stage 1 构建的前端产物拷入命名卷
  # （与 backend 同 Dockerfile；Docker layer 缓存复用，不会重复构建）
  frontend-copy:
    build:
      context: .
      dockerfile: Dockerfile
    image: bidforge-backend:latest
    entrypoint: ["sh", "-c", "cp -rn /app/frontend-dist/. /shared/"]
    volumes:
      - frontend-dist:/shared

  web:
    image: nginx:alpine
    container_name: bidforge-web
    depends_on:
      - frontend-copy
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - frontend-dist:/usr/share/nginx/html:ro
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  bidforge-data:
  frontend-dist:
