# BidForge 前端 nginx 配置
# 静态资源由容器内 /usr/share/nginx/html 提供；/api 反向代理到后端 8001
#
# 动态解析：backend 容器重建后 IP 会变，直接写 proxy_pass http://backend:8001
# 会让 nginx 启动时只解析一次并缓存旧 IP（导致 502）。
# 用 resolver + 变量强制每次请求重新解析 DNS（compose 网络内嵌 DNS 127.0.0.11）。
resolver 127.0.0.11 valid=5s ipv6=off;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 前端 API 代理（变量形式触发运行时 DNS 解析）
    set $backend_upstream http://backend:8001;
    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # SSE 实时进度（生成任务）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}
